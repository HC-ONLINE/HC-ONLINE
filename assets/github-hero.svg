<svg width="100%" height="260" viewBox="0 0 1200 260" fill="none" 
    xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
            <stop stop-color="#080B12"/>
            <stop offset="0.5" stop-color="#0D1117"/>
            <stop offset="1" stop-color="#080B12"/>
        </linearGradient>
        <linearGradient id="line" x1="0" y1="0" x2="1200" y2="0">
            <stop stop-color="#58A6FF" stop-opacity="0"/>
            <stop offset="0.5" stop-color="#58A6FF"/>
            <stop offset="1" stop-color="#58A6FF" stop-opacity="0"/>
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="4" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M40 0H0V40" stroke="#30363D" stroke-width="0.6" opacity="0.35"/>
        </pattern>
    </defs>
    <!-- Background -->
    <rect width="1200" height="260" rx="16" fill="url(#bg)"/>
    <rect width="1200" height="260" rx="16" fill="url(#grid)"/>
    <!-- Ambient glow -->
    <circle cx="150" cy="130" r="90" fill="#1F6FEB" opacity="0.06">
        <animate attributeName="r"
           values="80;110;80"
           dur="6s"
           repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="130" r="90" fill="#8957E5" opacity="0.06">
        <animate attributeName="r"
           values="110;80;110"
           dur="7s"
           repeatCount="indefinite"/>
    </circle>
    <!-- Architecture lines -->
    <path d="M80 130 C220 60 300 200 430 130 S650 60 780 130 S1000 200 1120 130"
   stroke="url(#line)"
   stroke-width="1"
   opacity="0.5">
        <animate attributeName="d"
        values="
        M80 130 C220 60 300 200 430 130 S650 60 780 130 S1000 200 1120 130;
        M80 130 C220 200 300 60 430 130 S650 200 780 130 S1000 60 1120 130;
        M80 130 C220 60 300 200 430 130 S650 60 780 130 S1000 200 1120 130"
        dur="12s"
        repeatCount="indefinite"/>
    </path>
    <!-- Moving signal -->
    <circle r="3" fill="#58A6FF" filter="url(#glow)">
        <animateMotion
    dur="5s"
    repeatCount="indefinite"
    path="M80 130 C220 60 300 200 430 130 S650 60 780 130 S1000 200 1120 130"/>
    </circle>
    <circle r="2" fill="#A371F7" filter="url(#glow)">
        <animateMotion
    dur="7s"
    begin="1s"
    repeatCount="indefinite"
    path="M1120 130 C1000 200 900 60 780 130 S550 200 430 130 S200 60 80 130"/>
    </circle>
    <!-- Architecture nodes -->
    <g filter="url(#glow)">
        <circle cx="150" cy="130" r="5" fill="#58A6FF">
            <animate attributeName="r"
             values="4;7;4"
             dur="3s"
             repeatCount="indefinite"/>
        </circle>
        <circle cx="400" cy="130" r="5" fill="#58A6FF">
            <animate attributeName="r"
             values="7;4;7"
             dur="3.5s"
             repeatCount="indefinite"/>
        </circle>
        <circle cx="600" cy="130" r="6" fill="#A371F7">
            <animate attributeName="r"
             values="5;8;5"
             dur="4s"
             repeatCount="indefinite"/>
        </circle>
        <circle cx="800" cy="130" r="5" fill="#58A6FF">
            <animate attributeName="r"
             values="7;4;7"
             dur="3.5s"
             repeatCount="indefinite"/>
        </circle>
        <circle cx="1050" cy="130" r="5" fill="#A371F7">
            <animate attributeName="r"
             values="4;7;4"
             dur="3s"
             repeatCount="indefinite"/>
        </circle>
    </g>
    <!-- Labels -->
    <g
fill="#8B949E"
font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
font-size="11"
text-anchor="middle">
        <text x="150" y="165">BACKEND</text>
        <text x="400" y="165">SECURITY</text>
        <text x="600" y="165">AI INFRA</text>
        <text x="800" y="165">FRONTEND</text>
        <text x="1050" y="165">SYSTEMS</text>
    </g>
    <!-- Center identity -->
    <text
x="600"
y="75"
text-anchor="middle"
fill="#F0F6FC"
font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
font-size="25"
font-weight="700">

HC-ONLINE

</text>
    <text
x="600"
y="100"
text-anchor="middle"
fill="#8B949E"
font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
font-size="12">

SOFTWARE ENGINEERING · SECURITY · INFRASTRUCTURE

</text>
    <!-- Bottom signal -->
    <rect x="330" y="215" width="540" height="1" fill="#30363D"/>
    <rect x="500" y="215" width="200" height="1" fill="#58A6FF" opacity="0.8">
        <animate attributeName="x"
        values="330;670;330"
        dur="6s"
        repeatCount="indefinite"/>
        <animate attributeName="width"
        values="80;220;80"
        dur="6s"
        repeatCount="indefinite"/>
    </rect>
</svg>
